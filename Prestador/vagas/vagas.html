<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial - Conecta-Lar</title>
    <link rel="stylesheet" href="vagas.css">
    <script src="vagas.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" />
</head>

<body>
    <header>
        <section aria-label="Barra de Acessibilidade" class="toolbar-acessibilidade">
            <h2 class="sr-only">Ferramentas de Acessibilidade</h2>

            <button id="btnSwitchMode" aria-pressed="false">
                <i class="ri-moon-line" aria-hidden="true"></i>
                <span>Escuro</span>
            </button>

            <button id="btnSwitchContrast" aria-pressed="false">
                <i class="ri-contrast-line" aria-hidden="true"></i>
                <span>Contraste</span>
            </button>

            <div class="btnFontSize" role="group" aria-label="Controles de tamanho de fonte">
                <button id="smallestFont" aria-label="Diminuir tamanho da fonte">
                    <i class="ri-subtract-line" aria-hidden="true"></i>
                </button>
                <span id="sizeFont" aria-live="polite">16px</span>
                <button id="largeFont" aria-label="Aumentar tamanho da fonte">
                    <i class="ri-add-line" aria-hidden="true"></i>
                </button>
            </div>

            <button id="btnSwitchDyslexia" aria-pressed="false">
                <i class="ri-text" aria-hidden="true"></i>
                <span>Dislexia</span>
            </button>

            <button id="btnSwitchReader" aria-pressed="false">
                <i class="ri-volume-up-line" aria-hidden="true"></i>
                <span>Leitor</span>
            </button>

            <button id="btnSwitchLibras" aria-pressed="false">
                <i class="ri-translate-2" aria-hidden="true"></i>
                <span>Libras</span>
            </button>

            <button id="btnSwitchCursor" aria-pressed="false">
                <i class="ri-cursor-line" aria-hidden="true"></i>
                <span>Cursor</span>
            </button>

            <button id="btnSwitchSpacing" aria-pressed="false">
                <i class="ri-space" aria-hidden="true"></i>
                <span>Espaçamento</span>
            </button>
        </section>
    </header>

    <nav class="sidebar" aria-label="Navegação Principal">
        <ul class="nav-links">
            <li>
                <a href="#" class="active" aria-label="Página Inicial de Vagas" aria-current="page">
                    <i class="ri-briefcase-2-line" aria-hidden="true"></i>
                </a>
            </li>
            <li>
                <a href="../mensagens/chat.html" aria-label="Mensagens">
                    <i class="ri-message-line" aria-hidden="true"></i>
                </a>
            </li>
            <li>
                <a href="../agenda/calendario.html" aria-label="Agenda">
                    <i class="ri-calendar-event-line" aria-hidden="true"></i>
                </a>
            </li>
            <li>
                <a href="../perfil/perfil.html" aria-label="Perfil do usuário">
                    <i class="ri-user-3-line" aria-hidden="true"></i>
                </a>
            </li>
        </ul>
    </nav>

    <main class="conteudo" id="area-leitura" tabindex="-1">
        <section class="container-informacoes">

            <div id="card-prestador-exibicao" class="card-prestador hidden"></div>

            <form id="form-prestador" class="form-cadastro hidden" action="#" method="POST">
                <h2>Cadastrar Perfil Profissional</h2>

                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Maria Silva" required>
                </div>

                <div class="form-group">
                    <label for="localizacao">Localização</label>
                    <input type="text" id="localizacao" name="localizacao" placeholder="Ex: São Paulo, SP - Bairro Pinheiros" required>
                </div>

                <div class="form-group">
                    <label for="profissao">Profissão</label>
                    <input type="text" id="profissao" name="profissao" placeholder="Ex: Cuidador(a) de Idosos / Acompanhante" required>
                </div>

                <div class="form-group">
                    <label for="especializacao">Especialização</label>
                    <input type="text" id="especializacao" name="especializacao" placeholder="Ex: Atendimento a PCD, Mobilidade Reduzida" required>
                </div>

                <div class="form-group">
                    <label for="certificados">Certificados e Cursos</label>
                    <textarea id="certificados" name="certificados" rows="3" placeholder="Descreva seus certificados, cursos e diplomas..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="valor">Valor do Serviço</label>
                        <input type="text" id="valor" name="valor" placeholder="Ex: R$ 120,00 / dia ou R$ 30,00 / hora" required>
                    </div>

                    <div class="form-group">
                        <label for="cargaHoraria">Carga Horária Disponível</label>
                        <input type="text" id="cargaHoraria" name="cargaHoraria" placeholder="Ex: 40h semanais / Plantão 12x36" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="editarFormulario" class="btn-editar">
                        <i class="ri-save-line" aria-hidden="true"></i> Editar Informações
                    </button>

                    <button type="submit" class="btn-salvar">
                        <i class="ri-save-line" aria-hidden="true"></i> Salvar Informações
                    </button>
                </div>
            </form>
        </section>
    </main>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
</body>
</html>
