<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso à Conta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-container">
    <div id="tabs-header" class="tabs">
      <button id="btn-login" class="tab-btn active" onclick="switchTab('login')">Entrar</button>
      <button id="btn-register" class="tab-btn" onclick="switchTab('register')">Cadastrar</button>
    </div>

    <form id="form-login" class="auth-form active">
      <h2>Entrar na Conta</h2>
      <input type="email" placeholder="E-mail" required>
      <input type="password" placeholder="Senha" required>
      
      <a href="#" class="forgot-link" onclick="switchTab('forgot')">Esqueceu a senha?</a>
      
      <button type="submit" class="submit-btn">Entrar</button>
      <p class="switch-text">Não tem conta? <a href="#" onclick="switchTab('register')">Cadastre-se</a></p>
    </form>

    <form id="form-register" class="auth-form">
      <h2>Criar Nova Conta</h2>
      <input type="text" placeholder="Nome Completo" required>
      <input type="email" placeholder="E-mail" required>
      <input type="password" placeholder="Senha" required>
      <button type="submit" class="submit-btn">Cadastrar</button>
      <p class="switch-text">Já tem conta? <a href="#" onclick="switchTab('login')">Faça login</a></p>
    </form>

    <form id="form-forgot" class="auth-form">
      <h2>Recuperar Senha</h2>
      <p class="info-text">Digite seu e-mail cadastrado e enviaremos as instruções para redefinir sua senha.</p>
      <input type="email" placeholder="Seu e-mail cadastrado" required>
      <button type="submit" class="submit-btn">Enviar Link de Recuperação</button>
      <p class="switch-text"><a href="#" onclick="switchTab('login')">← Voltar para o Login</a></p>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
